name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

# This workflow reads the checkout and publishes nothing. Without an explicit
# block the job would receive the repository default, which can be the legacy
# read/write GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            sdk/js/package-lock.json
      - name: Install Neo compiler (nccs)
        run: dotnet tool install -g neo.compiler.csharp --version 3.9.1
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install SDK dependencies
        working-directory: sdk/js
        run: npm ci
      - name: Install Playwright browser for frontend e2e
        working-directory: frontend
        run: npm run test:e2e:install
      # KNOWN RED, tracked as audit finding N-DEP-1; do not silence it here.
      #
      # verify_repo.sh builds contracts/UnifiedSmartWallet.csproj, which
      # resolves Neo.SmartContract.Framework at the version pinned in
      # contracts/Directory.Build.props (3.10.2-CI00384). nuget.org publishes up
      # to 3.10.1 and no configured feed carries that build, so restore fails
      # NU1102 here and the job stops at this step. The pin is deliberate - the
      # wallet emits System.Contract.CallWithGasLimit, which no released
      # framework produces - so the fix is an upstream publish or a reviewed
      # feed decision, not a downgrade and not a skip. Two related facts belong
      # with that decision: this repository has no nuget.config, and the syscall
      # exists in no released Neo core, so an artifact built from a vendored
      # feed would still not be deployable to a public node.
      - name: Verify repository
        run: ./scripts/verify_repo.sh
