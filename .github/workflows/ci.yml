name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

# This workflow reads the checkout and publishes nothing. Without an explicit
# block the job would receive the repository default, which can be the legacy
# read/write GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            sdk/js/package-lock.json
      # Needs no packages, so it still runs while the gate below is red.
      - name: Repository hygiene and package-pin tests
        run: node --test scripts/repo_hygiene.test.mjs scripts/check_neo_platform_packages.test.mjs scripts/fuzz_continuous.test.mjs
      # KNOWN RED until the owner action in docs/NEO-PLATFORM-PACKAGES.md is done
      # (audit finding R-11 / N-DEP-1); do not silence it here.
      #
      # contracts/Directory.Build.props pins Neo.SmartContract.Framework
      # 3.10.2-CI00384 because the wallet calls Contract.CallWithGasLimit, which
      # no released framework declares (3.9.1, 3.10.0 and 3.10.1 fail with
      # CS0117); the contract tests need the matching private TestEngine and Neo
      # core. Seven of the eight packages in contracts/neo-platform-packages.json
      # are on no public feed and there is no nuget.config, so restore fails
      # NU1102. This step fails within seconds with the owner action instead of
      # failing deep inside verify_repo.sh, and once a feed exists it refuses
      # packages whose bytes differ from the audited ones. The fix is a reviewed
      # feed plus nuget.config, not a downgrade and not a skip; no released Neo
      # core activates the syscall, so these artifacts are still not deployable
      # to a public node.
      - name: Check pinned Neo platform packages
        run: node scripts/check_neo_platform_packages.mjs
      - name: Install Neo compiler (nccs)
        run: dotnet tool install -g neo.compiler.csharp --version 3.9.1
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install SDK dependencies
        working-directory: sdk/js
        run: npm ci
      - name: Install Playwright browser for frontend e2e
        working-directory: frontend
        run: npm run test:e2e:install
      - name: Verify repository
        run: ./scripts/verify_repo.sh
