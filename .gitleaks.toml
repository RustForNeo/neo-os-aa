# gitleaks configuration for neo-os-aa.
#
# Keeps every default rule. Each allowlist below covers one finding that was
# triaged individually and is scoped to one rule, one file and one assignment of
# one value shape, so the same value anywhere else, a different value on that
# line, or any other secret in the same file is still reported. Never allowlist
# a live credential here: rotate it.

# Verified with the gitleaks release the NeoOS secret-scan workflows pin.
minVersion = "v8.30.1"

[extend]
useDefault = true

[[allowlists]]
description = """\
Golden X25519 test keypair for the Morpheus confidential-envelope round trip. \
The same fixture is in neo-os-services \
(crates/neo-os-compute/tests/vectors/confidential-envelope-v2-client.json) and neo-os-devpack \
(shared/test/morpheus-confidential-envelope.test.ts); its public half is pinned in the same \
file as GOLDEN_PUBLIC_KEY_RAW, and GOLDEN_ENVELOPE only decrypts with it. Triaged \
2026-09-28: the derived public key matches GOLDEN_PUBLIC_KEY_RAW and differs from the MainNet \
oracle encryption key returned by MorpheusOracle.oracleEncryptionPublicKey; TestNet returns \
none.\
"""
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^sdk/js/tests/morpheus-envelope-roundtrip\.unit\.test\.js$''']
regexTarget = "match"
# An X25519 PKCS#8 private key is 48 DER bytes: this 21-character base64 prefix, then 43
# characters of key material, no padding.
regexes = ['''^GOLDEN_PRIVATE_KEY_PKCS8 = 'MC4CAQAwBQYDK2VuBCIEI[A-Za-z0-9+/]{43}'$''']

[[allowlists]]
description = """\
The Web3AuthVerifier script hash of the canonical shared TestNet deployment. A contract \
script hash is public chain data, published here in a documentation example, and is not a \
credential. Triaged 2026-10-09 (RV-DSCU163R1-r1, minor): generic-api-key reports the \
`name = '0x<40 hex>'` assignment shape in the SDK usage document. The same hash appears in \
plain backticks in README.md:120, docs/PLUGIN_MATRIX.md:18 and the registry module \
frontend/src/config/generatedMorpheusRegistry.js, where it is not reported. The allowance is \
one rule, one file and the exact assignment line carrying this value: a different value on \
that line, the same value assigned anywhere else, or any other secret in this file is still \
reported.\
"""
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^frontend/src/assets/docs/sdk-usage\.md$''']
regexTarget = "line"
# The full line, anchored, with the literal reviewed value: `const web3AuthVerifierHash =
# '0x1111f5b6b046a964c75d208998c13945ce172e85';` (sdk-usage.md:45).
regexes = ['''^[[:space:]]*const web3AuthVerifierHash = '0x1111f5b6b046a964c75d208998c13945ce172e85';[[:space:]]*$''']
