<svg xmlns="http://www.w3.org/2000/svg" width="1540" height="760" viewBox="0 0 1540 760" role="img" aria-labelledby="title desc">
<title>UserOperation Lifecycle</title><desc>The protocol path from canonical authorization to committed application result</desc><style>
.bg{fill:#f7fafc}.title{font:700 34px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#102a43}.subtitle{font:400 17px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#52606d}.h{font:700 22px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#102a43}.body{font:400 17px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#243b53}.small{font:400 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#52606d}.white{fill:#fff}.card{stroke:#bcccdc;stroke-width:2}.blue{fill:#e6f0ff;stroke:#4c84c4;stroke-width:2}.green{fill:#e8f7ef;stroke:#3a9d68;stroke-width:2}.purple{fill:#f0e9ff;stroke:#7952b3;stroke-width:2}.amber{fill:#fff4d6;stroke:#d99a16;stroke-width:2}.red{fill:#fff0f0;stroke:#d64545;stroke-width:2}.gray{fill:#eef2f6;stroke:#829ab1;stroke-width:2}.dashed{stroke-dasharray:9 7}.arrow{stroke:#486581;stroke-width:3;fill:none;marker-end:url(#arrow)}.arrow2{stroke:#9fb3c8;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.danger{stroke:#d64545;stroke-width:3;fill:none;marker-end:url(#redarrow)}.num{font:700 19px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#fff}.label{font:700 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#334e68}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#486581"/></marker><marker id="redarrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d64545"/></marker></defs><rect class="bg" width="1540" height="760"/>
<text x="60" y="62" class="title">UserOperation Lifecycle</text><text x="60" y="94" class="subtitle">The protocol path from canonical authorization to committed application result</text>
<rect x="70" y="150" width="260" height="104" rx="16" class="green"/><circle cx="105" cy="185" r="20" fill="#3a9d68"/><text x="98" y="192" class="num">1</text><text x="140" y="185" class="h">Construct</text><text x="140" y="216" class="small">Canonical UserOperation</text>
<rect x="390" y="150" width="260" height="104" rx="16" class="green"/><circle cx="425" cy="185" r="20" fill="#3a9d68"/><text x="418" y="192" class="num">2</text><text x="460" y="185" class="h">Authorize</text><text x="460" y="216" class="small">Sign / prove domain-bound op</text>
<rect x="710" y="150" width="300" height="104" rx="16" class="blue"/><circle cx="745" cy="185" r="20" fill="#4c84c4"/><text x="738" y="192" class="num">3</text><text x="780" y="185" class="h">Submit</text><text x="780" y="216" class="small">Relayer or user sends Neo tx</text>
<path d="M 330 202 L 380 202" class="arrow"/><path d="M 650 202 L 700 202" class="arrow"/>
<rect x="1060" y="150" width="400" height="104" rx="16" class="blue"/><circle cx="1095" cy="185" r="20" fill="#4c84c4"/><text x="1088" y="192" class="num">4</text><text x="1130" y="185" class="h">Core pre-checks</text><text x="1130" y="216" class="small">Shape | deadline | nonce | binding</text><path d="M 1010 202 L 1050 202" class="arrow"/>
<rect x="1060" y="330" width="400" height="125" rx="16" class="purple"/><circle cx="1095" cy="365" r="20" fill="#7952b3"/><text x="1088" y="372" class="num">5</text><text x="1130" y="365" class="h">Bounded verifier</text><text x="1130" y="396" class="small">Read-only authorization callback</text><text x="1130" y="422" class="small">Independent child resource budget</text><path d="M 1260 255 L 1260 320" class="arrow"/>
<rect x="710" y="330" width="270" height="125" rx="16" class="blue"/><circle cx="745" cy="365" r="20" fill="#4c84c4"/><text x="738" y="372" class="num">6</text><text x="780" y="365" class="h">Commit nonce</text><text x="780" y="396" class="small">Only after authorization</text><text x="780" y="422" class="small">Before stateful callbacks</text><path d="M 1060 392 L 990 392" class="arrow"/>
<rect x="390" y="330" width="260" height="125" rx="16" class="amber"/><circle cx="425" cy="365" r="20" fill="#d99a16"/><text x="418" y="372" class="num">7</text><text x="460" y="365" class="h">Policy + target</text><text x="460" y="396" class="small">preExecute -> target call</text><text x="460" y="422" class="small">Scoped application context</text><path d="M 710 392 L 660 392" class="arrow"/>
<rect x="70" y="330" width="260" height="125" rx="16" class="green"/><circle cx="105" cy="365" r="20" fill="#3a9d68"/><text x="98" y="372" class="num">8</text><text x="140" y="365" class="h">Finalize</text><text x="140" y="396" class="small">postHook + postVerifier</text><text x="140" y="422" class="small">Event + result</text><path d="M 390 392 L 340 392" class="arrow"/>
<rect x="70" y="535" width="1390" height="150" rx="18" class="red"/><text x="105" y="580" class="h">Failure at any stage</text><text x="105" y="616" class="body">Fault closed: no apparent success, no durable authorization context, and no committed nonce / target / callback state.</text><text x="105" y="650" class="body">Transaction fees are not retroactively refunded. A target Boolean false is not automatically a VM fault; the selected policy decides.</text>
<path d="M 1260 455 C 1260 510 1220 535 1180 535" class="danger"/><path d="M 850 455 C 850 510 900 535 900 535" class="danger"/><path d="M 520 455 C 520 510 620 535 620 535" class="danger"/><path d="M 200 455 C 200 510 300 535 360 535" class="danger"/>
</svg>