<svg xmlns="http://www.w3.org/2000/svg" width="1540" height="840" viewBox="0 0 1540 840" role="img" aria-labelledby="title desc">
<title>Neo N3 Abstract Account Protocol - Three-Layer Model</title><desc>How the generic witness layer, AA foundation, and native profile relate</desc><style>
.bg{fill:#f7fafc}.title{font:700 34px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#102a43}.subtitle{font:400 17px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#52606d}.h{font:700 22px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#102a43}.body{font:400 17px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#243b53}.small{font:400 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#52606d}.white{fill:#fff}.card{stroke:#bcccdc;stroke-width:2}.blue{fill:#e6f0ff;stroke:#4c84c4;stroke-width:2}.green{fill:#e8f7ef;stroke:#3a9d68;stroke-width:2}.purple{fill:#f0e9ff;stroke:#7952b3;stroke-width:2}.amber{fill:#fff4d6;stroke:#d99a16;stroke-width:2}.red{fill:#fff0f0;stroke:#d64545;stroke-width:2}.gray{fill:#eef2f6;stroke:#829ab1;stroke-width:2}.dashed{stroke-dasharray:9 7}.arrow{stroke:#486581;stroke-width:3;fill:none;marker-end:url(#arrow)}.arrow2{stroke:#9fb3c8;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.danger{stroke:#d64545;stroke-width:3;fill:none;marker-end:url(#redarrow)}.num{font:700 19px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#fff}.label{font:700 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#334e68}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#486581"/></marker><marker id="redarrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d64545"/></marker></defs><rect class="bg" width="1540" height="840"/>
<text x="60" y="62" class="title">Neo N3 Abstract Account Protocol - Three-Layer Model</text><text x="60" y="94" class="subtitle">How the generic witness layer, AA foundation, and native profile relate</text>
<rect x="80" y="145" width="900" height="175" rx="18" class="green"/>
<text x="115" y="190" class="h">Layer 1 - Generic witness layer (#218)</text>
<text x="115" y="226" class="body">Verification-trigger witness validation</text>
<text x="115" y="253" class="body">Generic script shape, call flags, invocation data</text>
<text x="115" y="280" class="small">Reusable authentication primitive; not an AA state machine</text>
<rect x="80" y="350" width="900" height="205" rx="18" class="blue"/>
<text x="115" y="396" class="h">Layer 2 - AA protocol foundation (#243)</text>
<text x="115" y="432" class="body">UserOperation | account identity | 2D nonce | authorization commitment</text>
<text x="115" y="459" class="body">Verifier / hook lifecycle | execution order | rollback semantics</text>
<text x="115" y="486" class="body">Witness bridge | resource boundaries | conformance vectors</text>
<text x="115" y="520" class="small">Deployment-independent protocol rules</text>
<rect x="80" y="585" width="900" height="175" rx="18" class="purple"/>
<text x="115" y="630" class="h">Layer 3 - Native AccountManagement profile (#242)</text>
<text x="115" y="666" class="body">Native identity and address | consensus activation | ABI versions</text>
<text x="115" y="693" class="body">GAS / resource schedule | governance | upgrades | migration</text>
<text x="115" y="730" class="small">A separate native protocol decision; not implied by #243</text>
<path d="M 530 320 L 530 345" class="arrow"/><path d="M 530 555 L 530 580" class="arrow"/>
<text x="1030" y="195" class="h">Optional extensions</text>
<rect x="1030" y="225" width="430" height="90" rx="14" class="amber"/><text x="1060" y="263" class="body">Transfer of control (#219)</text><text x="1060" y="289" class="small">Optional account-governance extension</text>
<rect x="1030" y="345" width="430" height="90" rx="14" class="amber"/><text x="1060" y="383" class="body">Metadata and discovery (#220)</text><text x="1060" y="409" class="small">Presentation layer; not authorization</text>
<rect x="1030" y="465" width="430" height="90" rx="14" class="amber"/><text x="1060" y="503" class="body">Paymaster / relay profiles</text><text x="1060" y="529" class="small">Fee payment is separate from authority</text>
<path d="M 980 450 C 1000 450 1000 270 1025 270" class="arrow2"/><path d="M 980 450 L 1025 390" class="arrow2"/><path d="M 980 450 C 1000 450 1000 510 1025 510" class="arrow2"/>
<rect x="1030" y="625" width="430" height="135" rx="14" class="gray"/><text x="1060" y="665" class="h">Key boundary</text><text x="1060" y="700" class="body">#243 defines protocol behavior.</text><text x="1060" y="727" class="body">#242 defines native activation.</text><text x="1060" y="754" class="small">Implementation evidence is not adoption.</text>
</svg>