<svg xmlns="http://www.w3.org/2000/svg" width="1540" height="760" viewBox="0 0 1540 760" role="img" aria-labelledby="title desc">
<title>Abstract Account Application Scenarios</title><desc>Different authorization and policy profiles share one execution protocol</desc><style>
.bg{fill:#f7fafc}.title{font:700 34px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#102a43}.subtitle{font:400 17px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#52606d}.h{font:700 22px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#102a43}.body{font:400 17px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#243b53}.small{font:400 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#52606d}.white{fill:#fff}.card{stroke:#bcccdc;stroke-width:2}.blue{fill:#e6f0ff;stroke:#4c84c4;stroke-width:2}.green{fill:#e8f7ef;stroke:#3a9d68;stroke-width:2}.purple{fill:#f0e9ff;stroke:#7952b3;stroke-width:2}.amber{fill:#fff4d6;stroke:#d99a16;stroke-width:2}.red{fill:#fff0f0;stroke:#d64545;stroke-width:2}.gray{fill:#eef2f6;stroke:#829ab1;stroke-width:2}.dashed{stroke-dasharray:9 7}.arrow{stroke:#486581;stroke-width:3;fill:none;marker-end:url(#arrow)}.arrow2{stroke:#9fb3c8;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.danger{stroke:#d64545;stroke-width:3;fill:none;marker-end:url(#redarrow)}.num{font:700 19px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#fff}.label{font:700 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#334e68}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#486581"/></marker><marker id="redarrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d64545"/></marker></defs><rect class="bg" width="1540" height="760"/>
<text x="60" y="62" class="title">Abstract Account Application Scenarios</text><text x="60" y="94" class="subtitle">Different authorization and policy profiles share one execution protocol</text>
<rect x="585" y="315" width="370" height="180" rx="22" class="blue"/><text x="665" y="365" class="h">AA Core</text><text x="665" y="402" class="body">UserOperation protocol</text><text x="665" y="430" class="body">Nonce + verifier + hooks</text><text x="665" y="458" class="body">Scoped target execution</text>
<rect x="80" y="145" width="360" height="125" rx="16" class="green"/><text x="115" y="190" class="h">Passkey / session key</text><text x="115" y="225" class="small">Scoped authorization with expiry</text><path d="M 440 208 C 500 208 515 340 575 350" class="arrow"/>
<rect x="80" y="350" width="360" height="125" rx="16" class="purple"/><text x="115" y="395" class="h">MultiSig / recovery</text><text x="115" y="430" class="small">Quorum or guardian policy</text><path d="M 440 412 L 575 412" class="arrow"/>
<rect x="80" y="555" width="360" height="125" rx="16" class="amber"/><text x="115" y="600" class="h">Native witness</text><text x="115" y="635" class="small">Reuse Neo witness scopes</text><path d="M 440 617 C 500 617 515 470 575 460" class="arrow"/>
<rect x="1020" y="145" width="410" height="125" rx="16" class="amber"/><text x="1055" y="190" class="h">Policy hook</text><text x="1055" y="225" class="small">Daily limits, allowlists, token rules</text><path d="M 1020 208 C 980 208 1025 340 965 350" class="arrow"/>
<rect x="1020" y="350" width="410" height="125" rx="16" class="green"/><text x="1055" y="395" class="h">Sponsored relay</text><text x="1055" y="430" class="small">Fee payer is separate from authority</text><path d="M 1020 412 L 965 412" class="arrow"/>
<rect x="1020" y="555" width="410" height="125" rx="16" class="purple"/><text x="1055" y="600" class="h">dApp / asset operation</text><text x="1055" y="635" class="small">NEP-17, marketplace, service call</text><path d="M 1020 617 C 980 617 1025 470 965 460" class="arrow"/>
<rect x="520" y="565" width="500" height="115" rx="16" class="gray"/><text x="565" y="610" class="h">Three separate questions</text><text x="565" y="642" class="body">Who may authorize? What policy applies? Who pays?</text>
</svg>