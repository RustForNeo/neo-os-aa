<svg xmlns="http://www.w3.org/2000/svg" width="1540" height="820" viewBox="0 0 1540 820" role="img" aria-labelledby="title desc">
<title>Verifier Resource Boundary</title><desc>Why a transaction-wide gas limit is not enough for untrusted verifier callbacks</desc><style>
.bg{fill:#f7fafc}.title{font:700 34px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#102a43}.subtitle{font:400 17px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#52606d}.h{font:700 22px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#102a43}.body{font:400 17px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#243b53}.small{font:400 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#52606d}.white{fill:#fff}.card{stroke:#bcccdc;stroke-width:2}.blue{fill:#e6f0ff;stroke:#4c84c4;stroke-width:2}.green{fill:#e8f7ef;stroke:#3a9d68;stroke-width:2}.purple{fill:#f0e9ff;stroke:#7952b3;stroke-width:2}.amber{fill:#fff4d6;stroke:#d99a16;stroke-width:2}.red{fill:#fff0f0;stroke:#d64545;stroke-width:2}.gray{fill:#eef2f6;stroke:#829ab1;stroke-width:2}.dashed{stroke-dasharray:9 7}.arrow{stroke:#486581;stroke-width:3;fill:none;marker-end:url(#arrow)}.arrow2{stroke:#9fb3c8;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.danger{stroke:#d64545;stroke-width:3;fill:none;marker-end:url(#redarrow)}.num{font:700 19px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#fff}.label{font:700 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#334e68}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#486581"/></marker><marker id="redarrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d64545"/></marker></defs><rect class="bg" width="1540" height="820"/>
<text x="60" y="62" class="title">Verifier Resource Boundary</text><text x="60" y="94" class="subtitle">Why a transaction-wide gas limit is not enough for untrusted verifier callbacks</text>
<rect x="70" y="145" width="930" height="570" rx="24" class="gray dashed"/><text x="105" y="190" class="h">Enclosing transaction budget</text><text x="105" y="220" class="small">The transaction may contain many operations, but it is not the verifier safety boundary.</text>
<rect x="130" y="270" width="390" height="300" rx="20" class="purple"/><text x="165" y="315" class="h">Verifier child budget Bv</text><text x="165" y="350" class="body">validateSignature</text><text x="165" y="378" class="small">Read-only callback</text><rect x="180" y="420" width="290" height="100" rx="14" class="blue"/><text x="210" y="460" class="body">Nested ordinary call</text><text x="210" y="490" class="small">Inherits Bv and all ancestors</text>
<rect x="580" y="270" width="350" height="300" rx="20" class="purple"/><text x="615" y="315" class="h">Verifier child budget Bv'</text><text x="615" y="350" class="body">postExecute</text><text x="615" y="378" class="small">Separate callback budget</text><rect x="630" y="420" width="250" height="100" rx="14" class="blue"/><text x="660" y="460" class="body">Nested bounded call</text><text x="660" y="490" class="small">Cannot escape Bv' or Btx</text>
<path d="M 260 245 L 260 260" class="arrow"/><path d="M 730 245 L 730 260" class="arrow"/><path d="M 325 420 L 325 385" class="arrow2"/><path d="M 755 420 L 755 385" class="arrow2"/>
<rect x="1060" y="170" width="400" height="115" rx="16" class="amber"/><text x="1095" y="215" class="h">No bypass</text><text x="1095" y="250" class="body">Fee whitelist does not disable Bv.</text>
<rect x="1060" y="325" width="400" height="145" rx="16" class="red"/><text x="1095" y="370" class="h">Exhaustion</text><text x="1095" y="408" class="body">Child or ancestor budget</text><text x="1095" y="436" class="body">exhaustion faults closed.</text>
<rect x="1060" y="510" width="400" height="145" rx="16" class="green"/><text x="1095" y="555" class="h">Atomic result</text><text x="1095" y="593" class="body">Nonce, target, callback,</text><text x="1095" y="621" class="body">and notifications roll back.</text>
<path d="M 1000 395 L 1050 395" class="danger"/><path d="M 1260 470 L 1260 500" class="arrow"/>
<text x="105" y="755" class="small">Protocol requirement: module execution must be finite, independently bounded, inherited through descendants, and fail closed.</text>
</svg>