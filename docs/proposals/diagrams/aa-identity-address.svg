<svg xmlns="http://www.w3.org/2000/svg" width="1570" height="800" viewBox="0 0 1570 800" role="img" aria-labelledby="title desc">
<title>Abstract Account Identity and Address Binding</title><desc>Three identifiers must remain distinct to avoid replay and migration ambiguity</desc><style>
.bg{fill:#f7fafc}.title{font:700 34px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#102a43}.subtitle{font:400 17px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#52606d}.h{font:700 22px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#102a43}.body{font:400 17px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#243b53}.small{font:400 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#52606d}.white{fill:#fff}.card{stroke:#bcccdc;stroke-width:2}.blue{fill:#e6f0ff;stroke:#4c84c4;stroke-width:2}.green{fill:#e8f7ef;stroke:#3a9d68;stroke-width:2}.purple{fill:#f0e9ff;stroke:#7952b3;stroke-width:2}.amber{fill:#fff4d6;stroke:#d99a16;stroke-width:2}.red{fill:#fff0f0;stroke:#d64545;stroke-width:2}.gray{fill:#eef2f6;stroke:#829ab1;stroke-width:2}.dashed{stroke-dasharray:9 7}.arrow{stroke:#486581;stroke-width:3;fill:none;marker-end:url(#arrow)}.arrow2{stroke:#9fb3c8;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.danger{stroke:#d64545;stroke-width:3;fill:none;marker-end:url(#redarrow)}.num{font:700 19px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#fff}.label{font:700 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#334e68}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#486581"/></marker><marker id="redarrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d64545"/></marker></defs><rect class="bg" width="1570" height="800"/>
<text x="60" y="62" class="title">Abstract Account Identity and Address Binding</text><text x="60" y="94" class="subtitle">Three identifiers must remain distinct to avoid replay and migration ambiguity</text>
<rect x="80" y="160" width="390" height="170" rx="18" class="blue"/><text x="115" y="210" class="h">Protocol identity</text><text x="115" y="250" class="body">networkMagic</text><text x="115" y="278" class="body">+ coreHash</text><text x="115" y="306" class="body">+ accountId</text>
<rect x="590" y="160" width="390" height="170" rx="18" class="green"/><text x="625" y="210" class="h">Account state key</text><text x="625" y="250" class="body">accountId: non-zero Hash160</text><text x="625" y="278" class="small">Identifies state within one core</text><text x="625" y="306" class="small">Not itself an asset address</text>
<rect x="1100" y="160" width="390" height="170" rx="18" class="purple"/><text x="1135" y="210" class="h">Asset-holding address</text><text x="1135" y="250" class="body">verification script -> address</text><text x="1135" y="278" class="small">Derived from exact script bytes</text><text x="1135" y="306" class="small">Call flags are address-relevant</text>
<path d="M 470 245 L 580 245" class="arrow"/><path d="M 980 245 L 1090 245" class="arrow"/>
<rect x="230" y="455" width="1080" height="150" rx="18" class="amber"/><text x="275" y="505" class="h">Migration rule</text><text x="275" y="545" class="body">Changing verification-script bytes changes the address.</text><text x="275" y="575" class="body">A profile must publish byte-order vectors and treat the change as explicit address / asset migration.</text>
<path d="M 1295 330 C 1295 390 1190 425 1190 445" class="danger"/>
<rect x="230" y="650" width="1080" height="80" rx="14" class="gray"/><text x="275" y="700" class="body">Do not conflate account identity, authorization module identity, and the address that holds assets.</text>
</svg>